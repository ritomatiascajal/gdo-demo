<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79">
  <title>Inspector de obra — Frías</title>
  <script>
    (function () { var t = null; try { t = localStorage.getItem('gdo-tema'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="icon" href="img/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/inspector.css">
</head>
<body>
  <header class="barra">
    <button id="btn-atras" class="icono" aria-label="Volver" hidden>‹</button>
    <div class="titulos">
      <h1 id="titulo">Inspector de obra</h1>
      <p id="subtitulo">Municipalidad de Frías</p>
    </div>
    <button class="btn-tema" data-tema aria-label="Cambiar entre modo claro y oscuro"></button>
    <button id="btn-menu" class="icono" aria-label="Salir" hidden title="Salir">⏻</button>
  </header>

  <main id="vista"></main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/inspector.js"></script>
</body>
</html>
